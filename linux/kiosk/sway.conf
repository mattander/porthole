output DSI-1 mode 800x1280 transform 270 scale 1
output * bg #171d25 solid_color
input type:touch map_to_output DSI-1
input "0:0:silead_ts" calibration_matrix 0 1 0 1 0 0
seat seat0 hide_cursor 500
xwayland disable
default_border none
gaps inner 0
gaps outer 0
for_window [app_id="firefox"] fullscreen enable
exec /usr/local/lib/porthole/browser-start
